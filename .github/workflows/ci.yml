name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  typecheck-and-tests:
    name: Typecheck and Unit Tests (no E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests (excluding E2E)
        run: pnpm test

  desktop-e2e-smoke:
    name: Desktop E2E Smoke (no AI model deps)
    # windows-latest (2026-06) maps to win25-vs2026 and breaks node-gyp + electron postinstall; pin 2025 image used by last green CI.
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm --filter @emk/desktop-media run rebuild:native

      - name: Build desktop app
        run: pnpm --filter @emk/desktop-media run build

      - name: Install Electron for E2E
        run: pnpm --filter @emk/desktop-media run ensure:electron

      - name: Verify Electron install
        shell: pwsh
        run: |
          $marker = "apps/desktop-media/tests/e2e/.electron-executable-path"
          $cacheExe = "apps/desktop-media/.cache/electron-dist/electron.exe"
          if (Test-Path $marker) { Get-Content $marker }
          if (-not (Test-Path $cacheExe)) { throw "Electron executable missing at $cacheExe" }

      - name: Run desktop E2E smoke subset
        run: pnpm --filter @emk/desktop-media run test:e2e:ci-smoke

  desktop-linux-dist:
    name: Desktop Linux distributable (AppImage + deb)
    # Build installers only on main (not on dev/PR) to save CI time; remove this `if` to build on every push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build and packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 fakeroot

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux distributables
        run: pnpm --filter @emk/desktop-media run dist:linux

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-release-artifacts
          path: apps/desktop-media/release/artifacts/**
          if-no-files-found: error

  desktop-windows-dist:
    name: Desktop Windows distributable (NSIS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows distributable
        run: pnpm --filter @emk/desktop-media run dist:win

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-release-artifacts
          path: apps/desktop-media/release/artifacts/**
          if-no-files-found: error
