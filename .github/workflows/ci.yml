name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"

jobs:
  typecheck-and-tests:
    name: Typecheck and Unit Tests (no E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests (excluding E2E)
        run: pnpm test

  desktop-e2e-smoke:
    name: Desktop E2E Smoke (no AI model deps)
    # windows-latest (2026-06) maps to win25-vs2026 and breaks node-gyp + electron postinstall; pin 2025 image used by last green CI.
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          $workspace = "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath $workspace
          Add-MpPreference -ExclusionProcess "electron.exe"

      - name: Rebuild native modules
        run: pnpm --filter @emk/desktop-media run rebuild:native

      - name: Build desktop app
        run: pnpm --filter @emk/desktop-media run build

      - name: Install Electron for E2E
        shell: pwsh
        working-directory: apps/desktop-media
        env:
          FORCE_ELECTRON_INSTALL: "1"
        run: |
          node scripts/ensure-electron.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marker = "tests/e2e/.electron-executable-path"
          if (-not (Test-Path $marker)) { throw "Electron marker missing at $marker" }
          $exe = (Get-Content $marker).Trim()
          if (-not (Test-Path $exe)) { throw "Electron executable missing at $exe" }
          Write-Host "Verified Electron at $exe"

      - name: Run desktop E2E smoke subset
        run: pnpm --filter @emk/desktop-media run test:e2e:ci-smoke

  desktop-linux-dist:
    name: Desktop Linux distributable (AppImage + deb)
    # Installers only on version tags (GitHub Releases). Avoid Actions artifact storage.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build and packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 fakeroot

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux distributables
        run: pnpm --filter @emk/desktop-media run dist:linux

      - name: Verify Linux installer outputs
        run: |
          ls -la apps/desktop-media/release/artifacts
          test -n "$(find apps/desktop-media/release/artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find apps/desktop-media/release/artifacts -maxdepth 1 -name '*.deb' -print -quit)"
          test -f apps/desktop-media/release/artifacts/latest-linux.yml

      - name: Upload Linux assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Blockmaps are optional; required files are checked above.
          files: |
            apps/desktop-media/release/artifacts/*.AppImage
            apps/desktop-media/release/artifacts/*.deb
            apps/desktop-media/release/artifacts/latest-linux.yml
            apps/desktop-media/release/artifacts/*.blockmap
          fail_on_unmatched_files: false
          overwrite_files: true

  desktop-windows-dist:
    name: Desktop Windows distributable (NSIS)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          $workspace = "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath $workspace
          Add-MpPreference -ExclusionProcess "electron.exe"

      - name: Build Windows distributable
        run: pnpm --filter @emk/desktop-media run dist:win

      - name: Verify Windows installer outputs
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop-media/release/artifacts | Format-Table Name, Length
          if (-not (Get-ChildItem apps/desktop-media/release/artifacts -Filter *.exe)) {
            throw "No Windows .exe installer found in release/artifacts"
          }
          if (-not (Test-Path apps/desktop-media/release/artifacts/latest.yml)) {
            throw "Missing latest.yml (required for electron-updater)"
          }

      - name: Upload Windows assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Blockmaps are optional; required files are checked above.
          files: |
            apps/desktop-media/release/artifacts/*.exe
            apps/desktop-media/release/artifacts/latest.yml
            apps/desktop-media/release/artifacts/*.blockmap
          fail_on_unmatched_files: false
          overwrite_files: true
